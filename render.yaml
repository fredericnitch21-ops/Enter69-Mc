services:
  - type: web
    name: enter-musica
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADD_NAME
        value: psique
      - key: DATA_DIR
        value: /data
      - key: SONG_TTL_HOURS
        value: "168"
      - key: MAX_AUDIO_MB
        value: "15"
      - key: MAX_SONGS
        value: "50"
      - key: TRUST_PROXY_HOPS
        value: "1"
    disk:
      name: enter-data
      mountPath: /data
      sizeGB: 10
